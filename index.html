<!-- Socket.io Real-Time Client for funny(1) -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
      const socket = io();

      // Fun cartoon boing sound effect (you can change this URL to any direct .mp3 link)
      const soundUrl = 'https://www.myinstants.com/media/sounds/cartoon-boing.mp3';
      const audio = new Audio(soundUrl);

      // Listen for the broadcast from the server when anyone types funny(1)
      socket.on('play-funny-sound', () => {
          audio.currentTime = 0; // Rewind to the start so it can be spam-clicked
          audio.play().catch(err => {
              console.log("Audio playback blocked by browser policy until page interaction:", err);
          });
      });

      // Expose the funny(n) function globally in the browser's developer console
      window.funny = function(n) {
          if (n === 1) {
              console.log("Sending funny signal to everyone...");
              socket.emit('trigger-funny');
          } else {
              console.log("Invalid argument. Try typing: funny(1)");
          }
      };
  </script>
</body>
